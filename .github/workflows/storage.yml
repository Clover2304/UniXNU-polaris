name: Read-only storage and security inputs
on:
  push:
    branches: ['work/polaris-ramdisk']
    paths: ['.github/workflows/storage.yml', 'configs/polaris_storage_defconfig', 'configs/polaris_storage_io_defconfig', 'configs/polaris_security_io_defconfig', 'scripts/build-storage-reference.py', 'scripts/build-storage-drivers.py', 'research/apple-storage-bindings.json', 'kernel-overrides/**', 'scripts/build-platform-kernel.py', 'drivers/**', 'board.toml', 'upstream.json']
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Isolated server-only component input'
        type: choice
        default: polaris_security_io_defconfig
        options: [polaris_storage_defconfig, polaris_storage_io_defconfig, polaris_security_io_defconfig]
permissions:
  contents: read
env:
  STORAGE_DEFCONFIG: ${{ inputs.defconfig || 'polaris_security_io_defconfig' }}
jobs:
  source-and-reference:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream
      - uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/IOStorageFamily
          ref: e45fbe30a7879e0b16e26dddb78538f1b00e0bff
          path: out/storage-source
      - name: Tools
        run: |
          brew install cmake ninja unifdef llvm lld
          XC=/Applications/Xcode_26.2.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig
          STORAGE_LLVM_TOOLS="$(brew --prefix llvm)/bin"
          test "$("$STORAGE_LLVM_TOOLS/llvm-cxxfilt" --no-strip-underscore _ZN9IOService5startEPS_)" = 'IOService::start(IOService*)'
      - name: Build deferred original-bootstrap source kernel
        run: |
          EXTRA_ARGS=()
          if [ "$STORAGE_DEFCONFIG" = polaris_storage_io_defconfig ] || [ "$STORAGE_DEFCONFIG" = polaris_security_io_defconfig ]; then
            EXTRA_ARGS+=(--storage-source out/storage-source --storage-bindings research/apple-storage-bindings.json)
          fi
          python3 scripts/build-platform-kernel.py --base out/upstream -j 4 --defconfig "$STORAGE_DEFCONFIG" --defer-prelink "${EXTRA_ARGS[@]}"
      - name: Compile public storage annotation with actual XNU record
        run: python3 scripts/build-storage-reference.py --tree out/native/polaris/tree --source out/storage-source --out out/storage-annotation
      - name: Verify actual trust-cache bootstrap compilation
        if: env.STORAGE_DEFCONFIG == 'polaris_security_io_defconfig'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,re,subprocess
          root=Path('out/native/polaris/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837')
          record=root/'osfmk/DEVELOPMENT/startup.o.json'
          obj=root/'osfmk/DEVELOPMENT/startup.o'
          j=json.loads(record.read_text().strip().rstrip(','));args=j['arguments']
          assert '-DXNU_NATIVE_TRUST_CACHE=1' in args
          llvm=Path(subprocess.check_output(['brew','--prefix','llvm'],text=True).strip())/'bin'
          reloc=subprocess.check_output([llvm/'llvm-objdump','-r',obj],text=True)
          calls=[line.strip() for line in reloc.splitlines() if re.search(r'ARM64_RELOC_BRANCH26\s+_trust_cache_init(?:\s|$)',line)]
          assert len(calls)==1,'The actual startup object must call trust_cache_init'
          out=Path('out/storage-annotation')
          (out/'startup-compile-record.json').write_text(json.dumps(j,indent=2)+'\n')
          report=dict(compiled=True,actual_startup_trust_cache_mode=1,branch_relocations=calls,
              object_sha256=hashlib.sha256(obj.read_bytes()).hexdigest(),
              compile_record_sha256=hashlib.sha256(record.read_bytes()).hexdigest(),
              runtime_initialized=False,original_security_modules_loaded=False,phone_accessed=False)
          (out/'security-bootstrap.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS: actual source startup.o contains one trust_cache_init call; runtime still unqualified')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-source-inputs
          retention-days: 7
          path: |
            out/native/polaris/kernel/
            out/storage-annotation/
            out/native/polaris/tree/build/native-aes/
            out/native/polaris/tree/build/native-virtio-block/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-source-diagnostics
          retention-days: 7
          path: out/native/polaris/logs/
