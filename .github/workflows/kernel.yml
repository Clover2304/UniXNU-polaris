name: Darwin 23 platform kernel
on:
  push:
    branches: ['work/polaris-ramdisk']
    paths: ['.github/workflows/**', 'scripts/**', 'drivers/**', 'kernel-overrides/**', 'tests/**', 'board.toml', 'configs/**', 'upstream.json']
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel milestone'
        default: 'polaris_defconfig'
        type: choice
        options:
          - polaris_defconfig
          - polaris_ramdisk_defconfig
          - polaris_prelink_defconfig
permissions:
  contents: read
env:
  POLARIS_DEFCONFIG: ${{ inputs.defconfig || 'polaris_ramdisk_defconfig' }}
jobs:
  efi:
    uses: ./.github/workflows/checks.yml
  kernel:
    # Standard Intel image retains Xcode 26.2 and avoids the ARM runner queue.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream
      - name: Tools
        run: |
          brew install cmake ninja unifdef llvm lld
          # The late Darwin 23 source has split IPC messages. Xcode 16.2's
          # public MIG/IIG still emit the older ABI (see sweet NOTES); this
          # Xcode 26.2 image provides the matching generators.
          XC=/Applications/Xcode_26.2.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig
      - name: Build source kernel and platform drivers
        run: python3 scripts/build-platform-kernel.py --base out/upstream -j 4 --defconfig "$POLARIS_DEFCONFIG"
      - name: Verify actual Apple signature page-size gate
        run: |
          python3 scripts/check-apple-signature-gate.py --source out/native/polaris/tree/.cache/xnu-work/bsd/kern/ubc_subr.c --out out/apple-signature-gate
          cp out/apple-signature-gate/report.json out/native/polaris/kernel/apple-signature-gate.json
      - name: Preserve compile records and generated headers
        if: always()
        run: |
          TREE=out/native/polaris/tree
          if [ -d "$TREE/.cache/xnu-work" ] && [ -d "$TREE/build/xnu" ]; then
            tar czf out/native-buildtree.tgz --exclude='.git' --exclude='*.o' --exclude='*.cpo' --exclude='*.a' -C "$TREE" .cache/xnu-work .cache/fakeroot build/xnu
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-kernel-results
          retention-days: 7
          path: |
            out/native/polaris/kernel/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-diagnostics
          retention-days: 7
          path: out/native/polaris/logs/

  native-check:
    needs: [kernel, efi]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-kernel-results
          path: out/kernel
      - uses: actions/download-artifact@v4
        with:
          name: efi-results
          path: out/efi
      - name: Tools
        run: python3 scripts/ensure-linux-tools.py --profile native
      - name: QEMU native platform check
        if: env.POLARIS_DEFCONFIG != 'polaris_prelink_defconfig'
        run: python3 scripts/check-platform-kernel.py --kernel out/kernel/kernel.macho --efi out/efi
      - name: Assemble mount-only RAM disk
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-root-probe.py --output out/mockfs-root.img
      - name: QEMU mockfs root mount checkpoint
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-platform-kernel.py --kernel out/kernel/kernel.macho --efi out/efi --initrd out/mockfs-root.img --out out/root-check
      - name: Assemble the polaris payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-esp --cpus 1
      - name: Assemble the mockfs root payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-root-esp --cpus 1 --ram 6 --initrd out/mockfs-root.img
      - name: Build the own static PID 1
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/build-polaris-init.py
      - name: QEMU first user process and real syscalls
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-init.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-init
      - name: QEMU refuse an incorrect init CDHash
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-init.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-init --negative wrong-cdhash --out out/init-wrong-hash-check
      - name: QEMU reject a damaged executable page
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-init.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-init --negative damaged-code --out out/init-damaged-code-check
      - name: QEMU refuse an unsigned init
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-init.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-init --negative missing-signature --out out/init-unsigned-check
      - name: Assemble the first-user-process payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-init-esp --cpus 1 --ram 6 --user-init out/polaris-init/launchd.macho
      - name: Build the resident I/O init
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/build-polaris-init.py --mode io --out out/polaris-io
      - name: QEMU RAM-file I/O, stdio and resident PID 1
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-io.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-io
      - name: QEMU missing RAM file refusal
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-io.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --init-dir out/polaris-io --negative missing-ram-file --out out/io-missing-file-check
      - name: Assemble the resident I/O payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-io-esp --cpus 1 --ram 6 --user-init out/polaris-io/launchd.macho
      - name: Build our multi-file root and child executable
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/build-polaris-process.py
      - name: QEMU fork exec wait and named RAM root
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-process
      - name: QEMU refuse an incorrect child CDHash
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-process --negative wrong-child-cdhash --out out/process-wrong-hash-check
      - name: QEMU refuse damaged child code
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-process --negative damaged-child --out out/process-damaged-check
      - name: QEMU refuse unsigned child code
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-process --negative unsigned-child --out out/process-unsigned-check
      - name: QEMU enforce child identity on a cached PID 1 signature
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-process --negative cached-init --out out/process-cached-init-check
      - name: Assemble the multi-program payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-process-esp --cpus 1 --ram 6 --process-dir out/polaris-process
      - name: Build writable tmp acceptance programs
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/build-polaris-process.py --tmp --out out/polaris-tmp
      - name: QEMU writable tmp lifecycle and capacity
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-tmp --out out/tmp-check
      - name: Assemble the writable tmp payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-tmp-esp --cpus 1 --ram 6 --process-dir out/polaris-tmp
      - name: Build 1000-child lifecycle acceptance programs
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/build-polaris-process.py --stress --out out/polaris-stress
      - name: QEMU serial and eight-child lifecycle stress
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/check-polaris-process.py --kernel out/kernel/kernel.macho --platform-esp out/root-check/esp --process-dir out/polaris-stress --out out/stress-check
      - name: Assemble the process stress payload ESP
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-stress-esp --cpus 1 --ram 6 --process-dir out/polaris-stress
      - name: Assemble SDM845 polling USB diagnostics payload
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-usb-esp --cpus 1 --ram 6 --process-dir out/polaris-stress --usb-console
      - name: Assemble opt-in UFS register snapshot payload
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-ufs-esp --cpus 1 --ram 6 --process-dir out/polaris-stress --usb-console --ufs-probe
      - name: Assemble read-only UFS queue and candidate stream inventory payload
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-ufs-inventory-esp --cpus 1 --ram 6 --process-dir out/polaris-stress --usb-console --ufs-probe --ufs-inventory
      - name: Assemble owned UFS queue and single NOP payload
        if: env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-ufs-nop-esp --cpus 1 --ram 6 --process-dir out/polaris-stress --usb-console --ufs-probe --ufs-inventory --ufs-nop
      - uses: actions/upload-artifact@v4
        if: always() && env.POLARIS_DEFCONFIG == 'polaris_ramdisk_defconfig'
        with:
          name: usb-stage-results
          retention-days: 7
          path: |
            out/polaris-stress/
            out/polaris-usb-esp/
            out/polaris-ufs-esp/
            out/polaris-ufs-inventory-esp/
            out/stress-check/report.json
            out/stress-check/serial.log
            out/stress-check/qemu.log
            out/stress-check/screen.ppm
            out/tmp-check/report.json
            out/process-check/report.json
            out/process-wrong-hash-check/report.json
            out/process-damaged-check/report.json
            out/process-unsigned-check/report.json
            out/process-cached-init-check/report.json
            out/io-check/report.json
            out/io-missing-file-check/report.json
            out/init-check/report.json
            out/init-wrong-hash-check/report.json
            out/init-damaged-code-check/report.json
